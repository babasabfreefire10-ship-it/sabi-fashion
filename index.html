<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABI Fashion</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.topbar{
  background:#111;
  color:white;
  text-align:center;
  padding:10px;
  font-size:12px;
  letter-spacing:1px;
}

.navbar{
  height:70px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  background:white;
  z-index:50;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:4px;
}

.navlinks{
  display:flex;
  gap:25px;
  align-items:center;
}

.navlinks button{
  background:none;
  border:0;
  font-size:13px;
  font-weight:bold;
}

.navicons{
  display:flex;
  gap:15px;
  align-items:center;
}

.icon-btn{
  background:none;
  border:0;
  font-size:23px;
  position:relative;
}

.cart-count{
  position:absolute;
  top:-7px;
  right:-9px;
  background:#111;
  color:white;
  width:18px;
  height:18px;
  border-radius:50%;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero{
  min-height:470px;
  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    url("https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1800&q=85")
    center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:30px;
}

.hero h1{
  font-size:60px;
  font-weight:900;
  letter-spacing:2px;
}

.hero p{
  margin:15px 0 25px;
  font-size:16px;
}

.hero button{
  background:white;
  color:#111;
  border:0;
  padding:15px 30px;
  font-weight:bold;
}

.section{
  padding:55px 6%;
}

.section-title{
  text-align:center;
  margin-bottom:30px;
}

.section-title h2{
  font-size:30px;
}

.categories{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:35px;
}

.categories button{
  padding:10px 18px;
  background:white;
  border:1px solid #ddd;
  border-radius:30px;
}

.categories button.active,
.categories button:hover{
  background:#111;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.product{
  cursor:pointer;
  position:relative;
}

.product-image{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  background:#f5f5f5;
}

.product-info{
  padding:13px 2px;
}

.product-category{
  color:#888;
  font-size:11px;
  text-transform:uppercase;
}

.product-name{
  font-size:15px;
  font-weight:bold;
  margin:6px 0;
}

.price{
  font-weight:bold;
}

.sale{
  color:#d00;
  margin-left:7px;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#111;
  color:white;
  padding:6px 9px;
  font-size:10px;
  font-weight:bold;
}

footer{
  background:#111;
  color:white;
  padding:45px 6%;
  margin-top:40px;
  text-align:center;
}

footer .logo{
  margin-bottom:15px;
}

/* MODALS */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:100;
}

.overlay.show{
  display:block;
}

.modal{
  background:white;
  width:min(900px,92%);
  max-height:90vh;
  overflow:auto;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border-radius:4px;
}

.close{
  position:absolute;
  top:12px;
  right:15px;
  border:0;
  background:none;
  font-size:28px;
  z-index:2;
}

.product-modal{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.product-modal img{
  width:100%;
  height:550px;
  object-fit:cover;
}

.product-details{
  padding:50px 35px;
}

.product-details h2{
  font-size:28px;
  margin:10px 0;
}

.product-details .big-price{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

select,
input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  margin:8px 0 15px;
  font-size:14px;
}

.primary{
  width:100%;
  background:#111;
  color:white;
  border:0;
  padding:15px;
  font-weight:bold;
}

/* CART */

.cart-drawer{
  position:fixed;
  right:-450px;
  top:0;
  height:100%;
  width:min(430px,100%);
  background:white;
  z-index:200;
  transition:.3s;
  box-shadow:-5px 0 25px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
}

.cart-drawer.open{
  right:0;
}

.cart-head{
  padding:22px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:20px;
}

.cart-item{
  display:flex;
  gap:12px;
  border-bottom:1px solid #eee;
  padding-bottom:15px;
  margin-bottom:15px;
}

.cart-item img{
  width:75px;
  height:95px;
  object-fit:cover;
}

.cart-item-info{
  flex:1;
}

.cart-item-info h4{
  margin-bottom:6px;
}

.remove{
  background:none;
  border:0;
  color:#999;
  font-size:12px;
}

.cart-bottom{
  padding:20px;
  border-top:1px solid #eee;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

/* CHECKOUT */

.checkout{
  width:min(550px,92%);
  padding:30px;
}

.checkout h2{
  margin-bottom:20px;
}

.order-products{
  background:#f7f7f7;
  padding:15px;
  margin-bottom:20px;
  font-size:14px;
}

.success{
  text-align:center;
  padding:30px;
}

.search-box{
  width:min(600px,90%);
  padding:35px;
}

.search-results{
  margin-top:15px;
}

.no-products{
  text-align:center;
  padding:50px;
  color:#777;
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .navlinks{
    display:none;
  }

  .hero h1{
    font-size:40px;
  }
}

@media(max-width:600px){
  .navbar{
    padding:0 20px;
  }

  .logo{
    font-size:22px;
  }

  .section{
    padding:40px 18px;
  }

  .products{
    gap:14px;
  }

  .product-modal{
    grid-template-columns:1fr;
  }

  .product-modal img{
    height:380px;
  }

  .product-details{
    padding:30px 22px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  TRANSPORT FALAS NË SHQIPËRI • POROSIT ONLINE
</div>

<nav class="navbar">

  <div class="logo">SABI</div>

  <div class="navlinks">
    <button onclick="showAll()">SHOP</button>
    <button onclick="filterProducts('new')">TË REJA</button>
    <button onclick="filterProducts('bluza')">BLUZA</button>
    <button onclick="filterProducts('tuta')">TUTA</button>
    <button onclick="filterProducts('sale')">SALE</button>
  </div>

  <div class="navicons">

    <button class="icon-btn" onclick="openSearch()">
      🔍
    </button>

    <button class="icon-btn" onclick="openCart()">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>

</nav>

<section class="hero">

  <div>
    <h1>VISH STILIN TËND.</h1>

    <p>
      Koleksioni i ri SABI Fashion
    </p>

    <button onclick="scrollToProducts()">
      SHIKO KOLEKSIONIN
    </button>
  </div>

</section>

<section class="section" id="shop">

  <div class="section-title">
    <h2>KOLEKSIONI</h2>
  </div>

  <div class="categories">

    <button class="active" onclick="showAll(this)">
      TË GJITHA
    </button>

    <button onclick="filterProducts('bluza',this)">
      BLUZA
    </button>

    <button onclick="filterProducts('tuta',this)">
      TUTA
    </button>

    <button onclick="filterProducts('new',this)">
      TË REJA
    </button>

    <button onclick="filterProducts('sale',this)">
      SALE
    </button>

  </div>

  <div class="products" id="products"></div>

</section>

<footer>

  <div class="logo">SABI</div>

  <p>Fashion • Style • Albania</p>

  <p style="margin-top:15px;font-size:12px;color:#aaa;">
    © 2026 SABI Fashion
  </p>

</footer>


<!-- PRODUCT MODAL -->

<div class="overlay" id="productOverlay" onclick="closeOutside(event,'productOverlay')">

  <div class="modal product-modal">

    <button class="close" onclick="closeProduct()">×</button>

    <img id="modalImage">

    <div class="product-details">

      <div class="product-category" id="modalCategory"></div>

      <h2 id="modalName"></h2>

      <div class="big-price" id="modalPrice"></div>

      <label>Masa</label>

      <select id="modalSize">
        <option value="">Zgjidh masën</option>
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>

      <button class="primary" onclick="addSelectedProduct()">
        SHTO NË SHPORTË
      </button>

    </div>

  </div>

</div>


<!-- CART -->

<div class="cart-drawer" id="cartDrawer">

  <div class="cart-head">

    <span>SHPORTA</span>

    <button class="close" onclick="closeCart()">×</button>

  </div>

  <div class="cart-items" id="cartItems"></div>

  <div class="cart-bottom">

    <div class="total">

      <span>TOTAL</span>

      <span id="cartTotal">0€</span>

    </div>

    <button class="primary" onclick="openCheckout()">
      VAZHDO ME POROSINË
    </button>

  </div>

</div>


<!-- CHECKOUT -->

<div class="overlay" id="checkoutOverlay">

  <div class="modal checkout">

    <button class="close" onclick="closeCheckout()">×</button>

    <h2>POROSIA JOTE</h2>

    <div class="order-products" id="checkoutProducts"></div>

    <input id="customerName" type="text" placeholder="Emri dhe Mbiemri">

    <input id="customerPhone" type="tel" placeholder="Numri i telefonit">

    <input id="customerAddress" type="text" placeholder="Adresa / Qyteti">

    <textarea id="customerNote" rows="4" placeholder="Shënim për porosinë (opsionale)"></textarea>

    <button class="primary" onclick="sendOrder()">
      DËRGO POROSINË NË WHATSAPP
    </button>

  </div>

</div>


<!-- SEARCH -->

<div class="overlay" id="searchOverlay">

  <div class="modal search-box">

    <button class="close" onclick="closeSearch()">×</button>

    <h2>KËRKO</h2>

    <input
      id="searchInput"
      type="text"
      placeholder="Kërko produkt..."
      oninput="searchProducts()"
    >

    <div class="search-results" id="searchResults"></div>

  </div>

</div>


<script>

/* =========================
   PRODUKTET
========================= */

const products = [

  {
    id:1,
    name:"SABI Oversized Black",
    category:"bluza",
    price:25,
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80",
    new:true,
    sale:false
  },

  {
    id:2,
    name:"Premium White T-Shirt",
    category:"bluza",
    price:22,
    image:"https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=900&q=80",
    new:true,
    sale:false
  },

  {
    id:3,
    name:"Black Street Hoodie",
    category:"bluza",
    price:35,
    image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=80",
    new:false,
    sale:false
  },

  {
    id:4,
    name:"SABI Grey Hoodie",
    category:"bluza",
    price:32,
    image:"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=80",
    new:true,
    sale:true
  },

  {
    id:5,
    name:"Black Cargo Tuta",
    category:"tuta",
    price:39,
    image:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80",
    new:false,
    sale:false
  },

  {
    id:6,
    name:"Urban Grey Set",
    category:"tuta",
    price:45,
    image:"https://images.unsplash.com/photo-1552902865-b72c031ac5ea?auto=format&fit=crop&w=900&q=80",
    new:true,
    sale:false
  },

  {
    id:7,
    name:"Classic Black Pants",
    category:"tuta",
    price:30,
    image:"https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=900&q=80",
    new:false,
    sale:true
  },

  {
    id:8,
    name:"SABI Premium Set",
    category:"tuta",
    price:49,
    image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=900&q=80",
    new:true,
    sale:false
  }

];


/* =========================
   WHATSAPP
========================= */

const whatsappNumber = "4915212916914";


/* =========================
   CART
========================= */

let cart = JSON.parse(localStorage.getItem("sabiCart")) || [];

let selectedProduct = null;


/* =========================
   SHFAQ PRODUKTET
========================= */

function renderProducts(list = products){

  const container = document.getElementById("products");

  if(!list.length){

    container.innerHTML =
      '<div class="no-products">Nuk u gjet asnjë produkt.</div>';

    return;
  }

  container.innerHTML = list.map(product => `

    <div class="product" onclick="openProduct(${product.id})">

      ${product.sale ? '<div class="badge">SALE</div>' : ''}

      <img
        class="product-image"
        src="${product.image}"
        alt="${product.name}"
      >

      <div class="product-info">

        <div class="product-category">
          ${product.category}
        </div>

        <div class="product-name">
          ${product.name}
        </div>

        <div class="price">
          ${product.price}€
          ${product.sale ? '<span class="sale">SALE</span>' : ''}
        </div>

      </div>

    </div>

  `).join("");

}


/* =========================
   FILTER
========================= */

function filterProducts(type,button){

  let filtered = products;

  if(type === "bluza"){
    filtered = products.filter(p => p.category === "bluza");
  }

  if(type === "tuta"){
    filtered = products.filter(p => p.category === "tuta");
  }

  if(type === "new"){
    filtered = products.filter(p => p.new);
  }

  if(type === "sale"){
    filtered = products.filter(p => p.sale);
  }

  renderProducts(filtered);

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

}


function showAll(button){

  renderProducts(products);

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

}


/* =========================
   PRODUCT MODAL
========================= */

function openProduct(id){

  selectedProduct = products.find(p => p.id === id);

  if(!selectedProduct) return;

  document.getElementById("modalImage").src =
    selectedProduct.image;

  document.getElementById("modalCategory").textContent =
    selectedProduct.category;

  document.getElementById("modalName").textContent =
    selectedProduct.name;

  document.getElementById("modalPrice").textContent =
    selectedProduct.price + "€";

  document.getElementById("modalSize").value = "";

  document.getElementById("productOverlay").classList.add("show");

}


function closeProduct(){

  document.getElementById("productOverlay")
    .classList.remove("show");

}


function addSelectedProduct(){

  if(!selectedProduct) return;

  const size =
    document.getElementById("modalSize").value;

  if(!size){

    alert("Zgjidh një masë.");

    return;
  }

  cart.push({

    id:Date.now(),

    productId:selectedProduct.id,

    name:selectedProduct.name,

    price:selectedProduct.price,

    size:size,

    image:selectedProduct.image

  });

  saveCart();

  closeProduct();

  openCart();

}


/* =========================
   CART
========================= */

function saveCart(){

  localStorage.setItem(
    "sabiCart",
    JSON.stringify(cart)
  );

  renderCart();

}


function renderCart(){

  const container =
    document.getElementById("cartItems");

  const count =
    document.getElementById("cartCount");

  const total =
    document.getElementById("cartTotal");

  count.textContent = cart.length;

  if(cart.length === 0){

    container.innerHTML =
      '<div style="text-align:center;padding:50px 10px;color:#777;">Shporta është bosh.</div>';

    total.textContent = "0€";

    return;
  }

  let sum = 0;

  container.innerHTML = cart.map(item => {

    sum += item.price;

    return `

      <div class="cart-item">

        <img src="${item.image}">

        <div class="cart-item-info">

          <h4>${item.name}</h4>

          <div>Masa: ${item.size}</div>

          <strong>${item.price}€</strong>

          <br>

          <button
            class="remove"
            onclick="removeCartItem(${item.id})"
          >
            Hiqe
          </button>

        </div>

      </div>

    `;

  }).join("");

  total.textContent = sum + "€";

}


function removeCartItem(id){

  cart = cart.filter(item => item.id !== id);

  saveCart();

}


function openCart(){

  document.getElementById("cartDrawer")
    .classList.add("open");

}


function closeCart(){

  document.getElementById("cartDrawer")
    .classList.remove("open");

}


/* =========================
   CHECKOUT
========================= */

function openCheckout(){

  if(cart.length === 0){

    alert("Shporta është bosh.");

    return;
  }

  closeCart();

  const box =
    document.getElementById("checkoutProducts");

  box.innerHTML = cart.map(item => `

    <div style="margin-bottom:8px;">
      ${item.name} — Masa ${item.size} — ${item.price}€
    </div>

  `).join("");

  document.getElementById("checkoutOverlay")
    .classList.add("show");

}


function closeCheckout(){

  document.getElementById("checkoutOverlay")
    .classList.remove("show");

}


/* =========================
   DËRGO POROSINË
========================= */

function sendOrder(){

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const note =
    document.getElementById("customerNote").value.trim();


  if(!name || !phone || !address){

    alert("Plotëso emrin, telefonin dhe adresën.");

    return;
  }


  let total = 0;

  let productsText = "";


  cart.forEach((item,index) => {

    total += item.price;

    productsText +=
      `${index + 1}. ${item.name} | Masa: ${item.size} | ${item.price}€\n`;

  });


  const message =
`🛍️ POROSI E RE - SABI FASHION

👤 Emri: ${name}
📞 Telefoni: ${phone}
📍 Adresa: ${address}

📦 PRODUKTET:

${productsText}
💰 TOTALI: ${total}€

${note ? `📝 Shënim: ${note}` : ""}`;


  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );


}


/* =========================
   SEARCH
========================= */

function openSearch(){

  document.getElementById("searchOverlay")
    .classList.add("show");

  setTimeout(() => {

    document.getElementById("searchInput").focus();

  },100);

}


function closeSearch(){

  document.getElementById("searchOverlay")
    .classList.remove("show");

}


function searchProducts(){

  const query =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const results =
    document.getElementById("searchResults");


  if(!query){

    results.innerHTML = "";

    return;
  }


  const found =
    products.filter(product =>
      product.name.toLowerCase().includes(query) ||
      product.category.toLowerCase().includes(query)
    );


  if(!found.length){

    results.innerHTML =
      "<p>Nuk u gjet produkt.</p>";

    return;
  }


  results.innerHTML = found.map(product => `

    <div
      style="
        display:flex;
        gap:12px;
        align-items:center;
        padding:10px 0;
        border-bottom:1px solid #eee;
        cursor:pointer;
      "
      onclick="closeSearch();openProduct(${product.id})"
    >

      <img
        src="${product.image}"
        style="width:60px;height:75px;object-fit:cover;"
      >

      <div>

        <strong>${product.name}</strong>

        <div>${product.price}€</div>

      </div>

    </div>

  `).join("");

}


/* =========================
   HELPERS
========================= */

function closeOutside(event,id){

  if(event.target.id === id){

    document.getElementById(id)
      .classList.remove("show");

  }

}


function scrollToProducts(){

  document.getElementById("shop")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================
   START
========================= */

renderProducts();

renderCart();

</script>

</body>
</html>
